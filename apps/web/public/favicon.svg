<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#6366F1"/>
  
  <!-- Calendar base -->
  <rect x="50" y="60" width="100" height="90" rx="12" fill="white"/>
  
  <!-- Calendar header with dots -->
  <rect x="50" y="60" width="100" height="24" rx="12" fill="#A5B4FC"/>
  
  <!-- Binding rings -->
  <circle cx="70" cy="72" r="4" fill="white"/>
  <circle cx="100" cy="72" r="4" fill="white"/>
  <circle cx="130" cy="72" r="4" fill="white"/>
  
  <!-- Grid dots representing calendar days -->
  <circle cx="70" cy="100" r="5" fill="#C7D2FE"/>
  <circle cx="95" cy="100" r="5" fill="#C7D2FE"/>
  <circle cx="120" cy="100" r="5" fill="#C7D2FE"/>
  
  <circle cx="70" cy="120" r="5" fill="#C7D2FE"/>
  <circle cx="95" cy="120" r="5" fill="#C7D2FE"/>
  <circle cx="120" cy="120" r="5" fill="#C7D2FE"/>
  
  <!-- AI sparkle element (cute touch) -->
  <g transform="translate(125, 135)">
    <!-- Main sparkle star -->
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#FCD34D"/>
    <!-- Small accent sparkle -->
    <path d="M 10,-10 L 11,-8 L 13,-7 L 11,-6 L 10,-4 L 9,-6 L 7,-7 L 9,-8 Z" fill="#FCD34D"/>
  </g>
</svg>